[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "substratforge"
version = "0.1.0"
description = "High-density agent substrate runtime: suspend/resume sandbox orchestration (10x container density)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "substratforge contributors" }]
keywords = [
    "agent-substrate", "sandbox", "suspend-resume", "snapshot", "high-density",
    "agent-runtime", "gvisor", "firecracker", "serverless-agents", "orchestration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "pydantic>=2.0"]
zstd = ["zstandard>=0.21"]
lz4 = ["lz4>=4.3"]
s3 = ["boto3>=1.28"]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
substratforge = "substratforge.serving.cli:main"

[tool.setuptools.packages.find]
include = ["substratforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
